<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KARDEX</title>

<link rel="stylesheet" href="./css/style.css">

</head>

<body>

<div class="contenedor">
<img src="./img/logo.png" alt="Logo J&C" class="logo">

<h1>TechProcess</h1>
<h2>KARDEX</h2>

<div class="formulario">

<input type="text" id="lote" placeholder="Lote">

<input type="text" id="producto" placeholder="Producto">

<select id="movimiento">
<option>Entrada</option>
<option>Salida</option>
</select>

<input type="number" id="cantidad" placeholder="Cantidad">

<button onclick="registrar()">
Registrar
</button>

<button onclick="nuevoInventario()">
Nuevo Inventario
</button>


</div>

<hr>

<h2>MOSTRAR MOVIMIENTOS</h2>

<table id="tablaMovimientos">

<thead>

<tr>

<th>Fecha</th>
<th>Lote</th>
<th>Producto</th>
<th>Movimiento</th>
<th>Cantidad</th>
<th>Stock</th>
<th></th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<hr>

<h2>MOSTRAR STOCK ACTUAL</h2>

<table id="tablaStock">

<thead>

<tr>

<th>Lote</th>
<th>Producto</th>
<th>Stock</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script src="./js/script.js"></script>
</body>
</html>
